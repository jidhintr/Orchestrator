services:
  api:
    build: .
    ports:
      - "${ORCHESTRATOR_API_PORT:-8080}:8080"
    environment:
      MigrateOnStartup: "true"
      ConnectionStrings__Orchestrator: Host=host.docker.internal;Port=5432;Database=OrchStore;Username=sa;Password=${ORCHESTRATOR_HOST_DB_PASSWORD:?Set it in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
