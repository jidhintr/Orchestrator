services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?Set it in .env}
    ports:
      - "${ORCHESTRATOR_DB_PORT:-5433}:5432"
    volumes:
      - orchestrator-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "${ORCHESTRATOR_API_PORT:-8080}:8080"
    environment:
      MigrateOnStartup: "true"
      ConnectionStrings__Orchestrator: Host=host.docker.internal;Port=5432;Database=OrchStore;Username=sa;Password=${ORCHESTRATOR_HOST_DB_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  orchestrator-pgdata:
