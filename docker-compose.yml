services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${ORCHESTRATOR_DB_PASSWORD:?Copy .env.example to .env}
    ports:
      - "${ORCHESTRATOR_DB_PORT:-5433}:5432"
    volumes:
      - orchestrator-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orchestrator-pgdata:
