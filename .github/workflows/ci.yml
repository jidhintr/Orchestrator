name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Orchestrator.slnx
      - run: dotnet format Orchestrator.slnx --verify-no-changes --no-restore
      - run: dotnet build Orchestrator.slnx --no-restore -c Release
      - run: dotnet test --solution Orchestrator.slnx --no-build -c Release
      - name: EF model has no pending migration
        env:
          ConnectionStrings__Orchestrator: Host=localhost;Database=unused;Username=unused;Password=unused
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release --project src/Orchestrator.Infrastructure --startup-project src/Orchestrator.Api
      - name: Vulnerable dependencies
        run: |
          dotnet list Orchestrator.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -q "has the following vulnerable packages" vuln.txt

  k6-smoke:
    runs-on: ubuntu-latest
    needs: build-test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orchestrator
          POSTGRES_USER: orchestrator
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orchestrator -d orchestrator"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ConnectionStrings__Orchestrator: Host=localhost;Port=5432;Database=orchestrator;Username=orchestrator;Password=ci-only
      ASPNETCORE_URLS: http://localhost:5176
      ASPNETCORE_ENVIRONMENT: Development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: grafana/setup-k6-action@v1
      - name: Apply migrations
        run: |
          dotnet tool install --global dotnet-ef --version "10.0.*"
          dotnet ef database update --project src/Orchestrator.Infrastructure --startup-project src/Orchestrator.Api
      - name: Start API
        run: |
          dotnet run --project src/Orchestrator.Api -c Release &
          for i in $(seq 1 30); do curl -sf http://localhost:5176/api/health && break || sleep 2; done
      - run: k6 run k6/health.js
      - run: k6 run k6/departments.js
